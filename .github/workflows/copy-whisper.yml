
name: Copy Whisper Model to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download model from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0 --pattern tiny.pt

      - name: Verify SHA256
        run: |
          echo "65147644a518d12f04e32d6f3b26facc3f8dd46e5390956a9424a650c0ce22b9  tiny.pt" | sha256sum -c -

      - name: Commit model to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiny.pt
          git commit -m "Add verified Whisper tiny model"
          git push origin main
